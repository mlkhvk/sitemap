services:

  db:
    image: postgres:16
    container_name: sitemap-db
    environment:
      POSTGRES_DB: mapsite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mapsite"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: sitemap-backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sitemap-frontend
    ports:
      - "80:80"
    depends_on:
      - backend


volumes:
  postgres_data: